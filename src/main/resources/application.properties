spring.application.name=notification-service

server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5438/notification_service
spring.datasource.username=kartlynotif
spring.datasource.password=notif123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kartly.order_service.dto,com.kartly.notification_service.dto

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.kartly.notification_service.dto.OrderStatusEvent

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

notification.simulate-failure=false


management.endpoints.web.exposure.include=health,prometheus